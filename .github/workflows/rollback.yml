name: Rollback
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Що відкотити: web / api / matcher'
        required: true
        default: web
      version:
        description: 'Тег версії для відкоту (напр. web-20260726-a1b2c3d)'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rollback Web
        if: github.event.inputs.target == 'web'
        working-directory: apps/web
        run: |
          npm run build
          npx wrangler pages deploy apps/web/out --project-name=aniday --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Rollback API Worker
        if: github.event.inputs.target == 'api'
        run: npx wrangler rollback
        working-directory: apps/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
