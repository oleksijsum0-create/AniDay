name: Deploy Workers
on:
  push:
    branches: [main]
    paths:
      - 'apps/workers/**'
      - 'packages/**'
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy API Worker
        working-directory: apps/workers/api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Tag release
        run: |
          VERSION="api-$(date +'%Y%m%d')-${GITHUB_SHA:0:7}"
          git tag -a "$VERSION" -m "Deploy api: ${GITHUB_SHA:0:7}"
          git push origin "$VERSION"
