name: Daily Title Matching
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Matcher Worker
        working-directory: apps/workers/matcher
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Trigger matching
        run: |
          curl -X POST "https://aniday-matcher.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev/" \
            -H "Authorization: Bearer ${{ secrets.MATCHER_SECRET }}"
